<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Flexbox</h1>

    <h3>display:flex</h3>

    <h5>flex-direction: row;</h5>

    <div class="flex-container">
        <div class="flex-item">Item 1</div>
        <div class="flex-item">Item 2</div>
        <div class="flex-item">Item 3</div>
    </div>
    <style>
        .flex-container {
            display: flex;
            flex-direction: row; /**/
        }

        .flex-item {
            background-color: lightblue;
            padding: 20px;
            margin: 10px;
            text-align: center;
        }
    </style>

    <h5>flex-direction: column;</h5>
    <div class="flex-container2">
        <div class="flex-item2">Item 1</div>
        <div class="flex-item2">Item 2</div>
        <div class="flex-item2">Item 3</div>
    </div>
    <style>
        .flex-container2 {
            display: flex;
            flex-direction: column;
        }

        .flex-item2 {
            background-color: lightgreen;
            padding: 20px;
            margin: 10px;
            text-align: center;
        }
    </style>
</body>
</html>
