<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h4>flex-wrap: wrap;</h4>
    <p>Salto de Linea</p>
    <div class="flex-container">
        <div class="flex-item">Item 1</div>
        <div class="flex-item">Item 2</div>
        <div class="flex-item">Item 3</div>
        <div class="flex-item">Item 4</div>
        <div class="flex-item">Item 5</div>
        <div class="flex-item">Item 6</div>
    </div>
    <style>
        .flex-container{
            display: flex;
            flex-wrap: wrap; /**/
        }
        .flex-item{
            background-color: lightblue;
            padding: 20px;
            margin: 10px;
            text-align: center;
        }
    </style>
    <h4>flex-wrap: nowrap;</h4>
    <p>No Permite salto de linea</p>
    <div class="flex-container2">
        <div class="flex-item2">Item 1</div>
        <div class="flex-item2">Item 2</div>
        <div class="flex-item2">Item 3</div>
        <div class="flex-item2">Item 4</div>
        <div class="flex-item2">Item 5</div>
        <div class="flex-item2">Item 6</div>
    </div>
    <style>
        .flex-container2{
            display: flex;
            flex-wrap: nowrap; /**/
        }
        .flex-item2{
            background-color: lightgreen;
            padding: 20px;
            margin: 10px;
            text-align: center;
        }
    </style>
</body>
</html>
